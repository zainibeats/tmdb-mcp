services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    networks:
      - tmdb-net
    tty: true
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
      # Optional host directory for manually supplied GGUF files / Modelfiles.
      # Ollama does not scan this path on its own; import explicitly with:
      #   docker exec ollama ollama create <name> -f /models/Modelfile
      - ${MODELS_DIR:-./models}:/models
    # Requires an NVIDIA GPU plus the NVIDIA Container Toolkit on the host.
    # Delete this whole `deploy:` block to run Ollama on CPU only.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all # To pin cards, replace this line with: device_ids: ['0']
              capabilities: [gpu]

  open-webui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: open-webui
    restart: unless-stopped
    depends_on:
      - ollama
      - tmdb-mcpo
    networks:
      - tmdb-net
    ports:
      - "8080:8080"
    environment:
      - 'WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}'
      # Ollama is only reachable on the compose network; "localhost" inside this
      # container is the container itself, not the ollama service.
      - 'OLLAMA_BASE_URL=http://ollama:11434'
    volumes:
      - open-webui:/app/backend/data

  tmdb-mcpo:
    build:
      context: .
      dockerfile: Dockerfile.mcpo
    container_name: tmdb-mcpo
    restart: unless-stopped
    networks:
      - tmdb-net
    ports:
      - "8000:8000"
    environment:
      TMDB_API_KEY: ${TMDB_API_KEY}

volumes:
  ollama:
  open-webui:

networks:
  tmdb-net:
